services:
  mesh-bridge:
    build: .
    container_name: meshcore-hf
    restart: unless-stopped
    privileged: true
    environment:
      # Uncomment and modify these variables to override hardware auto-detection.
      # Values should be the 4-character hex ID (e.g., 10c4)
      PTT_VID: ""
      PTT_PID: ""
      MESH_VID: ""
      MESH_PID: ""
      MODEM_EXTRA_ARGS: ""
    volumes:
      - /dev:/dev
      - /sys:/sys:ro
      - ./config:/app/config
    ports:
      - "8001:8001"
